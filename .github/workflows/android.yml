# ══════════════════════════════════════════════════════════════════════
# [안드로이드 앱 자동 빌드]
# - 실행 조건: 앱 코드(android/) 또는 웹앱 화면(docs/index.html, 글꼴) 변경 push · 수동 실행
#   (웹앱이 토큰 교체 때 고치는 docs/key.json 은 제외 → 앱이 실행 중 최신본을 직접 받음)
# - 서명 키: 저장소 Secrets (ANDROID_KEYSTORE_B64 · ANDROID_KEYSTORE_PASSWORD)
#   미등록 시 임시 키로 서명 → 설치는 가능하나 다음 버전은 삭제 후 재설치 필요
# - 결과: APK 파일 → ① Actions 실행 결과 Artifacts ② Releases (휴대폰에서 바로 내려받기)
# ══════════════════════════════════════════════════════════════════════
name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "docs/index.html"
      - "docs/fonts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. 저장소 내려받기 ──
      - uses: actions/checkout@v4

      # ── 2. Java 17 · Gradle 준비 (러너에 Android SDK 기본 설치됨) ──
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # ── 3. 서명 키 복원 (Secrets 등록 시) ──
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"
            echo "고정 서명 키 사용"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 미등록 → 임시 키 서명 (업데이트 시 재설치 필요)"
          fi

      # ── 4. APK 빌드 ──
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: app
        run: gradle --no-daemon assembleRelease

      # ── 5. 파일명 정리: SebangSchedule_v1.0.<실행번호>.apk ──
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/SebangSchedule_v1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      # ── 6. 결과 업로드: Actions Artifacts ──
      - uses: actions/upload-artifact@v4
        with:
          name: SebangSchedule-apk-${{ github.run_number }}
          path: out/*.apk

      # ── 7. Releases 등록 (main 이외 브랜치는 시험판 표시) ──
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v1.0.${GITHUB_RUN_NUMBER}"
          PRE=""
          if [ "${GITHUB_REF_NAME}" != "main" ]; then PRE="--prerelease"; fi
          gh release create "$TAG" out/*.apk --target "${GITHUB_SHA}" $PRE \
            --title "업무 일정표 앱 v1.0.${GITHUB_RUN_NUMBER}" \
            --notes "브랜치 ${GITHUB_REF_NAME} · 커밋 ${GITHUB_SHA::7} · APK 파일을 휴대폰에서 내려받아 설치"
